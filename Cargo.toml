[package]
name = "EchoPlay"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
reqwest = { version = "0.12", features = ["json"] }
strum = { version = "0.26", features = ["derive"] }
regex = "1"
tracing = "0.1"
base64 = "0.22"
md-5 = "0.10"
rand = "0.8"
rodio = { version = "0.19", features = ["symphonia-mp3", "symphonia-flac", "symphonia-wav", "symphonia-vorbis"] }
lofty = "0.22"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
viuer = "0.7"
image = "0.25"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
dirs = "6"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
